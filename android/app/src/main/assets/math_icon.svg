<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Outer Border Gradient -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff00a0"/>
    </linearGradient>

    <!-- Cyan to Purple Neon Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Magenta to Purple Gradient -->
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <!-- Glowing Integral Main Gradient -->
    <linearGradient id="integralBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="35%" stop-color="#0088ff"/>
      <stop offset="70%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Glow for Background Elements -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Blue Base -->
  <rect width="1024" height="1024" fill="#040714"/>

  <!-- Faded Ambient Mathematical Equations Background -->
  <g opacity="0.15" stroke="#2a5298" fill="none" stroke-width="2">
    <path d="M 80 200 Q 200 100 320 200 T 560 200" />
    <text x="60" y="140" font-family="serif" font-size="42" fill="#3b82f6">x²</text>
    <text x="250" y="80" font-family="serif" font-size="48" fill="#3b82f6">∫</text>
    <text x="800" y="380" font-family="serif" font-size="36" fill="#3b82f6">lim</text>
    <text x="800" y="410" font-family="serif" font-size="20" fill="#3b82f6">n→∞</text>
    <text x="880" y="800" font-family="serif" font-size="36" fill="#3b82f6">n(x²)</text>
    <circle cx="850" cy="200" r="100"/>
  </g>

  <!-- App Icon Card Frame -->
  <rect x="128" y="128" width="768" height="768" rx="160" fill="#060919"/>
  <rect x="128" y="128" width="768" height="768" rx="160" fill="none" stroke="url(#iconBorder)" stroke-width="8" filter="url(#softGlow)"/>

  <!-- Nebula Cosmic Background Overlay -->
  <circle cx="350" cy="350" r="220" fill="#00d2ff" opacity="0.12" filter="url(#glow)"/>
  <circle cx="680" cy="350" r="180" fill="#ff00cc" opacity="0.12" filter="url(#glow)"/>

  <!-- Blue Constellation Network (Top Left) -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.6" fill="none">
    <circle cx="280" cy="300" r="4" fill="#00f0ff"/>
    <circle cx="340" cy="250" r="3" fill="#00f0ff"/>
    <circle cx="410" cy="290" r="5" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="310" cy="370" r="3" fill="#00f0ff"/>
    <line x1="280" y1="300" x2="340" y2="250"/>
    <line x1="340" y1="250" x2="410" y2="290"/>
    <line x1="280" y1="300" x2="310" y2="370"/>
  </g>

  <!-- Fine Perspective Grid Overlay (Behind Integral) -->
  <g stroke="#00d2ff" stroke-width="1" opacity="0.25" fill="none">
    <!-- Diamond Grid -->
    <polygon points="512,240 730,512 512,784 294,512"/>
    <line x1="512" y1="240" x2="512" y2="784"/>
    <line x1="294" y1="512" x2="730" y2="512"/>
    <!-- Horizontal Grid Subdivision Lines -->
    <line x1="348" y1="440" x2="675" y2="440"/>
    <line x1="348" y1="584" x2="675" y2="584"/>
    <line x1="403" y1="366" x2="621" y2="366"/>
    <line x1="403" y1="658" x2="621" y2="658"/>
    <!-- Vertical Grid Subdivision Lines -->
    <line x1="440" y1="330" x2="440" y2="690"/>
    <line x1="584" y1="330" x2="584" y2="690"/>
  </g>

  <!-- Coordinate System Axes (Cyan / Pink) -->
  <g stroke-width="3" filter="url(#softGlow)">
    <!-- X-Axis -->
    <line x1="512" y1="512" x2="750" y2="512" stroke="#00f0ff" stroke-dasharray="none"/>
    <path d="M 740 505 L 755 512 L 740 519" fill="#00f0ff"/>
    <text x="755" y="540" font-family="sans-serif" font-style="italic" font-weight="bold" font-size="32" fill="#00f0ff">x</text>

    <!-- Y-Axis -->
    <line x1="650" y1="620" x2="650" y2="380" stroke="#ff00aa"/>
    <path d="M 643 390 L 650 375 L 657 390" fill="#ff00aa"/>
    <text x="630" y="365" font-family="sans-serif" font-style="italic" font-weight="bold" font-size="32" fill="#ff00aa">y</text>
  </g>

  <!-- Sigma Symbol Σ -->
  <text x="325" y="535" font-family="sans-serif" font-weight="bold" font-size="68" fill="#ffffff" filter="url(#glow)">Σ</text>

  <!-- Differential Notation 'dx' -->
  <text x="530" y="700" font-family="serif" font-style="italic" font-weight="bold" font-size="72" fill="#7000ff" filter="url(#glow)">dx</text>
  <text x="530" y="700" font-family="serif" font-style="italic" font-weight="bold" font-size="72" fill="#00f0ff">dx</text>

  <!-- MAIN 3D INTEGRAL SYMBOL (Ribbon & Neon Glow) -->
  <g filter="url(#glow)">
    <!-- Outer Cyan/Purple Ribbon Backdrop -->
    <path d="M 400 710 C 310 710 320 580 430 500 C 520 435 630 380 620 270 C 610 180 500 200 450 250" 
          fill="none" stroke="url(#integralBody)" stroke-width="48" stroke-linecap="round"/>
    
    <!-- Inner Dark Core for Dual Ribbon Effect -->
    <path d="M 400 710 C 310 710 320 580 430 500 C 520 435 630 380 620 270 C 610 180 500 200 450 250" 
          fill="none" stroke="#060919" stroke-width="24" stroke-linecap="round"/>

    <!-- Bright Inner Neon Core Wire -->
    <path d="M 400 710 C 310 710 320 580 430 500 C 520 435 630 380 620 270 C 610 180 500 200 450 250" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Swirling Curl Bulb Ends -->
    <circle cx="395" cy="710" r="22" fill="url(#integralBody)"/>
    <circle cx="395" cy="710" r="10" fill="#ffffff"/>

    <circle cx="455" cy="250" r="22" fill="url(#integralBody)"/>
    <circle cx="455" cy="250" r="10" fill="#ffffff"/>
  </g>
</svg>
